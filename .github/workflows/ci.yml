name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://chat:chat_test_password@localhost:5432/chat_test?schema=public
      TEST_DATABASE_URL: postgresql://chat:chat_test_password@localhost:5432/chat_test?schema=public
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-only-access-token-secret-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm test:e2e:prepare

      - name: End-to-end test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit locked dependencies
        run: pnpm audit --audit-level high

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan filesystem dependencies and configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
