groups:
  - name: concurrent-chat-slo
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(chat_http_requests_total{status=~"5.."}[5m])) / sum(rate(chat_http_requests_total[5m])) > 0.01
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'API 5xx 比例连续 10 分钟超过 1%' }
      - alert: GenerationHighFailureRate
        expr: sum(rate(chat_generation_jobs_total{status="failed"}[10m])) / sum(rate(chat_generation_jobs_total[10m])) > 0.05
        for: 10m
        labels: { severity: page }
        annotations: { summary: 'Generation 失败比例连续 10 分钟超过 5%' }
      - alert: GenerationWorkerSilent
        expr: sum(rate(chat_generation_jobs_total[15m])) == 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          { summary: 'Worker 15 分钟没有消费任务；结合 outbox 和队列深度判断' }
      - alert: OutboxBacklogTooOld
        expr: chat_outbox_oldest_unpublished_seconds > 60
        for: 5m
        labels: { severity: page }
        annotations: { summary: '最老未发布 Outbox 事件已超过 60 秒' }
      - alert: GenerationQueueWaitHigh
        expr: histogram_quantile(0.95, sum(rate(chat_generation_queue_wait_seconds_bucket[10m])) by (le)) > 5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: 'Generation 最近队列等待持续超过 5 秒' }
      - alert: ProviderCredentialOrBalanceFailure
        expr: increase(chat_generation_provider_errors_total{code=~"AUTHENTICATION_FAILED|INSUFFICIENT_BALANCE"}[5m]) > 0
        labels: { severity: page }
        annotations: { summary: '模型供应商出现认证或余额错误，单次即告警' }
      - alert: GenerationHeartbeatFailures
        expr: increase(chat_generation_heartbeat_failures_total[5m]) > 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: '活动 Generation heartbeat 持续失败' }
      - alert: ApiResidentMemoryHigh
        expr: process_resident_memory_bytes{service="api"} > 1073741824
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: 'API RSS 连续 15 分钟超过 1 GiB' }
      - alert: EventForwardLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(chat_event_forward_latency_seconds_bucket[5m])) by (le)) > 0.2
        for: 10m
        labels: { severity: page }
        annotations: { summary: '应用内部事件转发 p95 连续 10 分钟超过 200ms' }
      - alert: RedisClientErrors
        expr: increase(chat_redis_client_errors_total[5m]) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          { summary: 'API 或 Worker 的 Redis 客户端持续出现连接错误' }
      - alert: OutboxDeadLetterPresent
        expr: chat_outbox_dead_letter_count > 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Outbox 出现死信，需要人工排查和恢复' }
      - alert: OutboxDeliveryFailures
        expr: increase(chat_outbox_delivery_failures_total[5m]) > 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: 'Outbox Relay 持续投递失败' }
      - alert: WorkerLostGeneration
        expr: increase(chat_generation_worker_lost_total[10m]) > 0
        labels: { severity: ticket }
        annotations:
          { summary: '出现 WORKER_LOST 终态，请检查 Worker 生命周期和队列' }
